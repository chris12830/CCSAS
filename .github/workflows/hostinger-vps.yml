name: Hostinger VPS validation
on:
  push:
    branches: [feature/hostinger-vps]
  workflow_dispatch:
concurrency:
  group: ccsas-hostinger-validation
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: node --experimental-transform-types --test tests/vps-auth-api.test.mjs
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
      - name: Build deployment image
        run: docker build -f deploy/Dockerfile -t ccsas-staging .
      - name: Run container access and persistence checks
        run: node scripts/vps-image-smoke.mjs ccsas-staging

